<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3f3f1">
<meta name="robots" content="noindex">
<title>EXIOR OS</title>
<meta name="description" content="EXIOR OS — the operating system of your company: agents, approvals, workflows and the company map in one place.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="os.css">
<script>
  // Apply the saved theme before first paint to avoid a flash.
  try{var s=JSON.parse(localStorage.getItem('exior-os-v1')||'{}').prefs||{};var t=s.theme||'system';
  if(t==='dark'||(t==='system'&&matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.dataset.theme='dark';}catch(e){}
</script>
</head>
<body>
<div class="app" id="app">
  <aside class="sb" aria-label="Sidebar">
    <div class="sb-top">
      <button class="ws" id="wsBtn" title="Workspace">
        <span class="mark"><svg width="15" height="15" viewBox="0 0 18 18" fill="none"><path d="M3 3l12 12M15 3L3 15" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/><circle cx="9" cy="9" r="2.3" fill="#29a372"/></svg></span>
        <span class="ws-txt"><b id="wsName">Northwind Supply</b><span>EXIOR OS</span></span>
        <svg class="chev" width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M4.5 5.5L7 3l2.5 2.5M4.5 8.5L7 11l2.5-2.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="search" id="searchBtn" aria-label="Search or run a command">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none"><circle cx="7" cy="7" r="4.6" stroke="currentColor" stroke-width="1.5"/><path d="M10.5 10.5L14 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        <span class="lbl">Search or command…</span><span class="kbd" id="kbdHint">⌘K</span>
      </button>
    </div>
    <nav class="nav" id="nav" aria-label="Primary"></nav>
    <div class="sb-bot">
      <span class="av">CM</span>
      <span class="who"><b>Claire Martin</b><span>Operations lead</span></span>
      <button class="iconbtn" id="themeBtn" aria-label="Toggle theme"></button>
    </div>
  </aside>

  <div class="main">
    <header class="top">
      <div class="crumbs" id="crumbs"></div>
      <div class="right">
        <span class="live"><i></i><span id="liveCount">6</span> AGENTS LIVE</span>
        <button class="iconbtn" id="helpBtn" aria-label="Keyboard shortcuts"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="1.5" y="4" width="13" height="8.5" rx="2" stroke="currentColor" stroke-width="1.4"/><path d="M4.5 7h.01M7 7h.01M9.5 7h.01M12 7h.01M5 9.8h6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg></button>
        <button class="iconbtn" id="searchBtn2" aria-label="Search"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="7" cy="7" r="4.6" stroke="currentColor" stroke-width="1.5"/><path d="M10.5 10.5L14 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></button>
      </div>
    </header>
    <main class="content" id="content" tabindex="-1"></main>
  </div>
</div>

<nav class="bnav" id="bnav" aria-label="Mobile"></nav>
<div class="more-sheet" id="moreSheet" role="dialog" aria-label="More"></div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-label="Details"></aside>
<div class="pal-scrim" id="palScrim" role="dialog" aria-modal="true" aria-label="Command palette"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script src="os.js"></script>
</body>
</html>
