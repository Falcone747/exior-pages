name: Publish EXIOR Pages

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build site
        run: |
          set -euo pipefail
          python scripts/build_marketing_pages.py
          mkdir -p _site/agents _site/onboarding _site/ai-agent _site/ai-teammate _site/custom-ai-agent _site/ai-agent-sprint _site/ai-agent-agencies _site/ai-agent-recruiting _site/ai-agent-accounting _site/comptabilite-ia _site/finance-automation _site/live _site/app
          cp app/home/index.html _site/index.html
          cp app/home/home.css _site/home.css
          cp app/onboarding/index.html _site/onboarding/index.html
          cp app/agents/index.html _site/agents/index.html
          cp app/ai-teammate/index.html _site/ai-agent/index.html
          cp app/ai-teammate/index.html _site/ai-teammate/index.html
          cp app/custom-ai-agent/index.html _site/custom-ai-agent/index.html
          cp app/ai-agent-sprint/index.html _site/ai-agent-sprint/index.html
          cp app/ai-agent-agencies/index.html _site/ai-agent-agencies/index.html
          cp app/ai-agent-recruiting/index.html _site/ai-agent-recruiting/index.html
          cp app/ai-agent-accounting/index.html _site/ai-agent-accounting/index.html
          cp app/comptabilite-ia/index.html _site/comptabilite-ia/index.html
          cp app/finance-automation/index.html _site/finance-automation/index.html
          cp app/live/index.html _site/live/index.html
          cat > _site/app/index.html <<'APP'
          <!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="refresh" content="0;url=https://app.exior.io/login"><title>EXIOR</title><script>location.replace('https://app.exior.io/login')</script>
          APP
          touch _site/.nojekyll
      - name: Validate site
        run: |
          set -euo pipefail
          test -s _site/index.html
          test -s _site/home.css
          grep -Fq 'See the company you should be running now.' _site/index.html
          grep -Fq 'Give EXIOR the company.' _site/index.html
          grep -Fq 'A decision system for what the company should become.' _site/index.html
          grep -Fq 'meta name="robots" content="index,follow"' _site/index.html
          ! grep -Fq 'Run EXIOR X-Ray' _site/index.html
          test -s _site/agents/index.html
          grep -Fq 'Agents that do the work' _site/agents/index.html
          test -s _site/marketing-agencies/index.html
          test -s _site/ai-agent/index.html
          test -s _site/live/index.html
          test -s _site/comptabilite-ia/index.html
          grep -Fq 'IA en comptabilité' _site/comptabilite-ia/index.html
          test -s _site/finance-automation/index.html
          grep -Fq 'Finance Automation Opportunity Map' _site/finance-automation/index.html
          ! grep -Fq 'url=/ai-teammate/' _site/ai-agent/index.html
          grep -F 'EXIOR CHAT' _site/live/index.html
          grep -F 'DIGITAL EMPLOYEE' _site/live/index.html
          ! grep -Fi 'vercel' _site/live/index.html
      - name: Validate finance automation source sentinel
        run: grep -Fq 'Automate the right finance work first' app/finance-automation/index.html
      - name: Site QA gate (mandatory, ratchet)
        run: |
          set -euo pipefail
          npm install --no-save --silent playwright@1.48.2
          npx --yes playwright@1.48.2 install --with-deps chromium > /dev/null
          (cd _site && python -m http.server 8000 > /dev/null 2>&1 &)
          sleep 2
          node scripts/site_qa.mjs http://127.0.0.1:8000/
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: _site

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Verify canonical EXIOR Hostinger-structured homepage
        run: |
          set -euo pipefail
          for i in $(seq 1 36); do
            code=$(curl -L -sS -o /tmp/home -w '%{http_code}' --max-time 20 "https://exior.io/?release=${GITHUB_SHA}" || true)
            if [ "$code" = "200" ] \
              && grep -Fq 'See the company you should be running now.' /tmp/home \
              && grep -Fq 'Give EXIOR the company.' /tmp/home \
              && grep -Fq 'A decision system for what the company should become.' /tmp/home \
              && grep -Fq 'index,follow' /tmp/home \
              && ! grep -Fq 'Run EXIOR X-Ray' /tmp/home; then
              echo "EXIOR_HOSTINGER_HOME_CANONICAL_OK sha=${GITHUB_SHA}"
              exit 0
            fi
            echo "attempt=$i code=$code"
            sleep 5
          done
          echo 'LIVE_HOME_VALIDATION_FAILED'
          head -c 1000 /tmp/home || true
          exit 1
      - name: Verify finance automation vertical
        run: |
          set -euo pipefail
          for i in $(seq 1 36); do
            code=$(curl -L -sS -o /tmp/finance-automation -w '%{http_code}' --max-time 20 "https://exior.io/finance-automation/?release=${GITHUB_SHA}" || true)
            if [ "$code" = "200" ] && grep -Fq 'Finance Automation Opportunity Map' /tmp/finance-automation && grep -Fq '£950' /tmp/finance-automation; then
              echo "FINANCE_AUTOMATION_VERTICAL_OK sha=${GITHUB_SHA}"
              exit 0
            fi
            echo "attempt=$i code=$code"
            sleep 5
          done
          echo 'FINANCE_AUTOMATION_VERTICAL_VALIDATION_FAILED'
          head -c 1000 /tmp/finance-automation || true
          exit 1
      - name: Verify agents page
        run: |
          set -euo pipefail
          for i in $(seq 1 36); do
            code=$(curl -L -sS -o /tmp/agents -w '%{http_code}' --max-time 20 "https://exior.io/agents/?release=${GITHUB_SHA}" || true)
            if [ "$code" = "200" ] && grep -Fq 'Agents that do the work' /tmp/agents; then
              echo "AGENTS_PAGE_OK sha=${GITHUB_SHA}"
              exit 0
            fi
            echo "attempt=$i code=$code"
            sleep 5
          done
          echo 'AGENTS_PAGE_VALIDATION_FAILED'
          head -c 1000 /tmp/agents || true
          exit 1
