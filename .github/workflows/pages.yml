name: Publish EXIOR Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build landing
        run: python scripts/build_marketing_pages.py
      - name: Validate landing
        run: |
          test -s _site/marketing-agencies/index.html
          test -s _site/marketing-agencies/agency.css
          grep -F 'https://buy.stripe.com/4gMbJ08rSdjl3Nx20R7IY00' _site/marketing-agencies/index.html
          grep -F 'EXIOR FOR MARKETING AGENCIES' _site/marketing-agencies/index.html
          grep -F 'Install an intelligence layer around your agency.' _site/marketing-agencies/index.html
          grep -F 'Install EXIOR — US$500' _site/marketing-agencies/index.html
          ! grep -F 'INDEPENDENT MARKETING' _site/marketing-agencies/index.html
      - name: Render visual QA
        run: |
          python -m http.server 8000 --directory _site >/tmp/exior-http.log 2>&1 &
          npx --yes playwright@1.55.0 install chromium
          npx --yes playwright@1.55.0 screenshot --browser=chromium --viewport-size="1440,1200" --full-page http://127.0.0.1:8000/marketing-agencies/ exior-desktop.png
          npx --yes playwright@1.55.0 screenshot --browser=chromium --viewport-size="390,844" --full-page http://127.0.0.1:8000/marketing-agencies/ exior-mobile.png
      - uses: actions/upload-artifact@v4
        with:
          name: visual-qa
          path: |
            exior-desktop.png
            exior-mobile.png
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
