name: Publish EXIOR Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build landing
        run: |
          python scripts/build_marketing_pages.py
          mkdir -p _site/onboarding _site/custom-ai-agent _site/ai-agent-sprint _site/ai-agent-agencies _site/ai-agent-recruiting _site/ai-agent-accounting
          cp app/onboarding/index.html _site/onboarding/index.html
          cp app/custom-ai-agent/index.html _site/custom-ai-agent/index.html
          cp app/ai-agent-sprint/index.html _site/ai-agent-sprint/index.html
          cp app/ai-agent-agencies/index.html _site/ai-agent-agencies/index.html
          cp app/ai-agent-recruiting/index.html _site/ai-agent-recruiting/index.html
          cp app/ai-agent-accounting/index.html _site/ai-agent-accounting/index.html
      - name: Validate landings
        run: |
          test -s _site/marketing-agencies/index.html
          test -s _site/marketing-agencies/agency.css
          test -s _site/marketing-agencies/premium.css
          test -s _site/onboarding/index.html
          test -s _site/custom-ai-agent/index.html
          test -s _site/ai-agent-agencies/index.html
          test -s _site/ai-agent-recruiting/index.html
          test -s _site/ai-agent-accounting/index.html
          grep -F 'EXIOR FOR MARKETING AGENCIES' _site/marketing-agencies/index.html
          grep -F 'CUSTOM AI AGENTS' _site/custom-ai-agent/index.html
          ! grep -Fi 'sprint' _site/custom-ai-agent/index.html
          grep -F 'AI AGENT FOR AGENCIES' _site/ai-agent-agencies/index.html
          grep -F 'RECRUITING AGENT' _site/ai-agent-recruiting/index.html
          grep -F 'ACCOUNTING OPS AGENT' _site/ai-agent-accounting/index.html
          ! grep -F 'AI AGENT FOR AGENCIES' _site/marketing-agencies/index.html
      - name: Render visual QA
        run: |
          python -m http.server 8000 --directory _site >/tmp/exior-http.log 2>&1 &
          npx --yes playwright@1.55.0 install chromium
          npx --yes playwright@1.55.0 screenshot --browser=chromium --viewport-size="1440,1200" --full-page http://127.0.0.1:8000/marketing-agencies/ exior-desktop.png
          npx --yes playwright@1.55.0 screenshot --browser=chromium --viewport-size="390,844" --full-page http://127.0.0.1:8000/marketing-agencies/ exior-mobile.png
          npx --yes playwright@1.55.0 screenshot --browser=chromium --viewport-size="1440,1200" --full-page http://127.0.0.1:8000/custom-ai-agent/ custom-ai-agent-desktop.png
          npx --yes playwright@1.55.0 screenshot --browser=chromium --viewport-size="390,844" --full-page http://127.0.0.1:8000/custom-ai-agent/ custom-ai-agent-mobile.png
          npx --yes playwright@1.55.0 screenshot --browser=chromium --viewport-size="1440,1200" --full-page http://127.0.0.1:8000/ai-agent-agencies/ ai-agent-agencies-desktop.png
          npx --yes playwright@1.55.0 screenshot --browser=chromium --viewport-size="1440,1200" --full-page http://127.0.0.1:8000/ai-agent-recruiting/ ai-agent-recruiting-desktop.png
          npx --yes playwright@1.55.0 screenshot --browser=chromium --viewport-size="1440,1200" --full-page http://127.0.0.1:8000/ai-agent-accounting/ ai-agent-accounting-desktop.png
      - uses: actions/upload-artifact@v4
        with:
          name: visual-qa
          path: |
            exior-desktop.png
            exior-mobile.png
            custom-ai-agent-desktop.png
            custom-ai-agent-mobile.png
            ai-agent-agencies-desktop.png
            ai-agent-recruiting-desktop.png
            ai-agent-accounting-desktop.png
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
