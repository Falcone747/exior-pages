name: Publish EXIOR Pages

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('qa-{0}', github.head_ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: |
          set -euo pipefail
          mkdir -p _site
          cp -a site/. _site/
          test -f _site/index.html
          test -f _site/CNAME
          test -f _site/.nojekyll
          test -f _site/commander/index.html
          grep -Fq '990' _site/index.html
          grep -Fq 'exior.io' _site/CNAME
          grep -Fq 'lang="fr"' _site/index.html
          ! grep -Fq 'See the company you should be running now.' _site/index.html
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: _site

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify:
    needs: deploy
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Verify French EXIOR homepage on exior.io
        run: |
          set -euo pipefail
          for i in $(seq 1 36); do
            code=$(curl -L -sS -o /tmp/home -w '%{http_code}' --max-time 20 "https://exior.io/?release=${GITHUB_SHA}" || true)
            if [ "$code" = "200" ] \
              && grep -Fq '990' /tmp/home \
              && grep -Fq 'lang="fr"' /tmp/home \
              && ! grep -Fq 'See the company you should be running now.' /tmp/home; then
              echo "EXIOR_FR_HOME_OK sha=${GITHUB_SHA}"
              ccode=$(curl -L -sS -o /tmp/cmd -w '%{http_code}' --max-time 20 "https://exior.io/commander" || true)
              test "$ccode" = "200"
              exit 0
            fi
            echo "attempt=$i code=$code"
            sleep 5
          done
          echo "VERIFY_FAILED"; exit 1
